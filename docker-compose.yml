services:
  ai-pulse:
    build: .
    container_name: ai_pulse
    ports:
      # Published on localhost only. To expose on a network, set AIPULSE_ADMIN_TOKEN first.
      - "127.0.0.1:8787:8787"
    env_file:
      - path: .env
        required: false
    volumes:
      - ai_pulse_data:/runtime
    restart: unless-stopped

volumes:
  ai_pulse_data:
