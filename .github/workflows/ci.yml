name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install (optional Claude SDK only)
        run: npm ci
      - name: Syntax check (server + browser modules)
        if: matrix.node >= 22
        shell: bash
        run: for f in server/*.js public/js/*.js public/sw.js; do node --check "$f"; done
      - name: Tests
        run: npm test
