<!doctype html>
<html lang="vi" data-theme="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI Pulse — GitHub AI/LLM Radar</title>
  <meta name="author" content="TienQuangPP" />
  <meta name="description" content="Real-time radar of AI/LLM adoption across GitHub open source." />
  <meta name="theme-color" content="#121211" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/js/theme.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <img src="/icon.svg" alt="" width="32" height="32" />
        <span><b>AI Pulse</b><small id="tagline"></small></span>
      </a>
      <nav id="nav" aria-label="Main"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menu-btn" aria-label="Menu">☰</button>
        <h1 id="page-title"></h1>
        <div class="range" id="range" role="tablist" aria-label="Time range"></div>
        <button class="search-btn" id="cmd-btn"><span>⌕</span><span id="cmd-label"></span><kbd>Ctrl K</kbd></button>
        <div class="status" id="status" aria-live="polite"></div>
        <button class="icon-btn" id="tv-btn" aria-label="TV mode" title="TV (F)">📺</button>
        <button class="icon-btn" id="lang-btn" aria-label="Language">VI</button>
        <button class="icon-btn" id="theme-btn" aria-label="Theme">◐</button>
      </header>
      <div class="banner" id="banner" hidden></div>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>

  <dialog class="palette" id="palette">
    <input id="palette-input" type="text" autocomplete="off" />
    <ul id="palette-list" role="listbox"></ul>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
